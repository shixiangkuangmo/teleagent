services:
  teleagent-dashboard:
    build: .
    container_name: teleagent-dashboard
    restart: unless-stopped
    ports:
      # 走 Cloudflare Tunnel（cloudflared 同机）时建议改为 "127.0.0.1:8590:8590"，origin 不对外开口
      - "8590:8590"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8590
      - TA_DATA_DIR=/app/data
      # 面板登录保护：值由同目录 .env 或部署平台的 Environment variables 注入，
      # 不用改本文件；两项都不设 = 不启用（公网/隧道暴露前务必设置）
      #   TA_PANEL_USER=admin
      #   TA_PANEL_PASSWORD=改成强密码
      #   （或用 TA_PANEL_PASSWORD_HASH=sha256("user:密码") 的 hex，二选一）
      - TA_PANEL_USER=${TA_PANEL_USER:-admin}
      - TA_PANEL_PASSWORD=${TA_PANEL_PASSWORD:-}
      - TA_PANEL_PASSWORD_HASH=${TA_PANEL_PASSWORD_HASH:-}
      # 登录页是否显示用户名提示：默认不显示；需要时设 TA_PANEL_HINT=1
      - TA_PANEL_HINT=${TA_PANEL_HINT:-}
    volumes:
      # 所有持久化数据（账号密文、JWT、网关节点、池 Key、用量）都在这里
      - ./data:/app/data
# 对外提供 /v1 时建议在前面加一层 HTTPS 反代（Caddy/Nginx/Cloudflare Tunnel）：
#   - 池 API Key 与节点 Token 走明文 HTTP 不安全
#   - 节点必须用 wss:// 连接，反代要转发 Upgrade 头
#   - /v1 流式响应必须关闭反代缓冲（proxy_buffering off）
